<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$title</title>
<style>
  @media only screen and (max-width: 600px) {
    .card { padding: 24px 18px !important; }
    .btn { display: block !important; text-align: center !important; }
  }
</style>
</head>
<body style="margin:0;padding:0;background:#f4f0e7;font-family:Arial,Helvetica,sans-serif;color:#1c2b24;">
<span style="display:none;max-height:0;overflow:hidden;opacity:0;">$preheader</span>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f0e7;">
  <tr>
    <td align="center" style="padding:24px 12px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;">
        <tr>
          <td style="padding:0 4px 14px;font-size:20px;font-weight:bold;color:#0f3d2e;">&#10022; $app_name</td>
        </tr>
        <tr>
          <td class="card" style="background:#ffffff;border-radius:14px;padding:32px;border:1px solid #e3ddcc;font-size:16px;line-height:1.6;">
            $body
          </td>
        </tr>
        <tr>
          <td style="padding:16px 4px;font-size:12px;color:#6b7a72;line-height:1.5;">
            You received this email because of activity on your $app_name account.
            If this wasn't you, you can safely ignore it.
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
